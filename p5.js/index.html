<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eye Detection Surveillance Visual</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    #ui {
      position: fixed;
      left: 18px;
      top: 18px;
      z-index: 10;
      width: 330px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      box-sizing: border-box;
    }

    #ui h1 {
      margin: 0 0 10px 0;
      font-size: 15px;
      letter-spacing: 0.12em;
      font-weight: 600;
      text-transform: uppercase;
    }

    #ui label {
      display: block;
      font-size: 12px;
      opacity: 0.72;
      margin-bottom: 5px;
    }

    #cameraSelect {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      background: #111;
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
    }

    #startBtn {
      width: 100%;
      padding: 10px;
      background: white;
      color: black;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.82);
      word-break: break-word;
    }

    #hint {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.35;
      opacity: 0.55;
    }

    video {
      display: none;
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>Eye / No Eye Trigger</h1>
    <label for="cameraSelect">Camera source</label>
    <select id="cameraSelect"></select>
    <button id="startBtn">Start Camera + Model + Heartbeat</button>
    <div id="status">Waiting to start...</div>
    <div id="hint">
      Optimised version. No Eye = low-res old TV snow + slow quiet heartbeat. Eye Detected = surveillance eye visual + urgent heartbeat.
    </div>
  </div>

  <video id="camera" autoplay playsinline muted></video>

  <script>
    /*
      Project: The Eye That Looks Back
    Author: Shuran Zhang

    Teachable Machine and TensorFlow.js are used to load the trained
    Eye / No Eye model and generate image-classification predictions.

    This project also includes camera selection, Eye / No Eye state control,
    visualEnergy transitions, real-time visual effects, and procedural
    heartbeat sound using p5.js and p5.sound.

    ChatGPT was used for code debugging and development support.
    */
   
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/L4ODWlo6P/";

    let model;
    let video;
    let cameraSelect;
    let statusDiv;

    let label = "";
    let confidence = 0;
    let eyeProb = 0;
    let noEyeProb = 0;
    let eyeDetected = false;
    let visualEnergy = 0;

    let currentStream = null;
    let lastPredictionTime = 0;
    let predictionInterval = 220; // Lower CPU load than 110ms
    let isClassifying = false;

    const EYE_ON_THRESHOLD = 0.72;
    const EYE_OFF_THRESHOLD = 0.48;

    // ---------- PERFORMANCE ----------
    let snowG;
    const SNOW_W = 180;
    const SNOW_H = 110;

    // ---------- HEARTBEAT SOUND ----------
    let heartOsc;
    let heartNoise;
    let heartFilter;
    let soundReady = false;
    let nextHeartbeatTime = 0;
    let beatToken = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      frameRate(30); // 30fps is much more stable for installation demo
      noSmooth();

      snowG = createGraphics(SNOW_W, SNOW_H);
      snowG.pixelDensity(1);
      snowG.noSmooth();

      video = document.getElementById("camera");
      cameraSelect = document.getElementById("cameraSelect");
      statusDiv = document.getElementById("status");

      document.getElementById("startBtn").addEventListener("click", startExperience);

      cameraSelect.addEventListener("change", async () => {
        if (currentStream || model) {
          statusDiv.innerHTML = "Switching camera source...";
          await startCamera(cameraSelect.value);
          statusDiv.innerHTML = "Camera source switched.";
        }
      });

      listCameras();
    }

    async function listCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameras = devices.filter(d => d.kind === "videoinput");

        const previousValue = cameraSelect.value;
        cameraSelect.innerHTML = "";

        cameras.forEach((cam, index) => {
          const option = document.createElement("option");
          option.value = cam.deviceId;
          option.textContent = cam.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        if (cameras.length === 0) {
          const option = document.createElement("option");
          option.textContent = "No camera found";
          cameraSelect.appendChild(option);
          return;
        }

        const preferredKeyword = "icspring";
        const preferred = cameras.find(cam => cam.label.toLowerCase().includes(preferredKeyword));
        const previous = cameras.find(cam => cam.deviceId === previousValue);

        if (previous) {
          cameraSelect.value = previous.deviceId;
        } else if (preferred) {
          cameraSelect.value = preferred.deviceId;
        }
      } catch (err) {
        statusDiv.innerHTML = "Could not list cameras. Click Start and allow camera permission.";
      }
    }

    async function startExperience() {
      try {
        statusDiv.innerHTML = "Loading heartbeat sound...";
        await initHeartbeatSound();

        statusDiv.innerHTML = "Loading model...";

        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);

        await startCamera(cameraSelect.value);
        await listCameras();

        statusDiv.innerHTML = "Model + camera + heartbeat ready.";

        if (!isClassifying) {
          isClassifying = true;
          classifyLoop();
        }
      } catch (err) {
        console.error(err);
        statusDiv.innerHTML = "Error: " + err.message;
      }
    }

    async function initHeartbeatSound() {
      if (soundReady) return;

      await userStartAudio();

      heartOsc = new p5.Oscillator("sine");
      heartOsc.freq(62);
      heartOsc.amp(0);
      heartOsc.start();

      heartNoise = new p5.Noise("brown");
      heartFilter = new p5.LowPass();

      heartNoise.disconnect();
      heartNoise.connect(heartFilter);
      heartNoise.start();
      heartNoise.amp(0);

      heartFilter.freq(160);
      heartFilter.res(6);

      soundReady = true;
      nextHeartbeatTime = millis() + 400;
    }

    function updateHeartbeatSound() {
      if (!soundReady) return;

      const now = millis();
      const targetInterval = eyeDetected ? lerp(420, 210, visualEnergy) : 1550;

      if (now > nextHeartbeatTime) {
        triggerHeartbeat();
        nextHeartbeatTime = now + targetInterval;
      }
    }

    function triggerHeartbeat() {
      if (!soundReady) return;

      const token = ++beatToken;
      const energy = eyeDetected ? constrain(visualEnergy, 0.35, 1) : 0;

      const lubAmp = eyeDetected ? 0.18 + energy * 0.32 : 0.018;
      const dubAmp = eyeDetected ? 0.12 + energy * 0.22 : 0.010;
      const noiseAmp = eyeDetected ? 0.055 + energy * 0.12 : 0.004;

      heartOsc.freq(eyeDetected ? 82 + energy * 25 : 45);
      heartFilter.freq(eyeDetected ? 190 + energy * 120 : 85);
      heartOsc.amp(lubAmp, 0.006);
      heartNoise.amp(noiseAmp, 0.006);

      setTimeout(() => {
        if (token !== beatToken) return;
        heartOsc.amp(0, eyeDetected ? 0.055 : 0.16);
        heartNoise.amp(0, eyeDetected ? 0.045 : 0.14);
      }, eyeDetected ? 65 : 130);

      setTimeout(() => {
        if (token !== beatToken) return;
        heartOsc.freq(eyeDetected ? 50 + energy * 13 : 36);
        heartFilter.freq(eyeDetected ? 120 + energy * 75 : 70);
        heartOsc.amp(dubAmp, 0.008);
        heartNoise.amp(noiseAmp * 0.72, 0.008);
      }, eyeDetected ? 120 : 210);

      setTimeout(() => {
        if (token !== beatToken) return;
        heartOsc.amp(0, eyeDetected ? 0.09 : 0.2);
        heartNoise.amp(0, eyeDetected ? 0.08 : 0.18);
      }, eyeDetected ? 215 : 380);
    }

    async function startCamera(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 24 }
        },
        audio: false
      };

      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;

      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    async function classifyLoop() {
      if (!model || !video || video.readyState < 2) {
        requestAnimationFrame(classifyLoop);
        return;
      }

      const now = millis();
      if (now - lastPredictionTime > predictionInterval) {
        lastPredictionTime = now;
        const predictions = await model.predict(video);
        readPredictions(predictions);
      }

      requestAnimationFrame(classifyLoop);
    }

    function readPredictions(predictions) {
      let best = predictions[0];
      eyeProb = 0;
      noEyeProb = 0;

      for (const p of predictions) {
        const name = p.className.toLowerCase();
        if (p.probability > best.probability) best = p;

        if (name.includes("eye") && !name.includes("no")) {
          eyeProb = p.probability;
        }

        if (name.includes("no") || name.includes("non")) {
          noEyeProb = p.probability;
        }
      }

      if (eyeProb === 0 && noEyeProb === 0 && predictions.length >= 2) {
        eyeProb = predictions[0].probability;
        noEyeProb = predictions[1].probability;
      }

      label = best.className;
      confidence = best.probability;

      if (!eyeDetected && eyeProb > EYE_ON_THRESHOLD) {
        eyeDetected = true;
      } else if (eyeDetected && eyeProb < EYE_OFF_THRESHOLD) {
        eyeDetected = false;
      }

      statusDiv.innerHTML =
        `Label: <b>${label}</b><br>` +
        `Confidence: ${(confidence * 100).toFixed(1)}%<br>` +
        `Eye probability: ${(eyeProb * 100).toFixed(1)}%<br>` +
        `Trigger: <b>${eyeDetected ? "EYE DETECTED / FAST HEARTBEAT" : "WAITING / TV SNOW + SLOW HEARTBEAT"}</b>`;
    }

    function draw() {
      background(4, 4, 4);

      visualEnergy = lerp(visualEnergy, eyeDetected ? 1 : 0, 0.06);
      updateHeartbeatSound();

      const snowAmount = 1.0 - visualEnergy;
      drawOldTVSnow(snowAmount);

      if (visualEnergy > 0.02) {
        push();
        translate(width / 2, height / 2);
        drawingContext.globalAlpha = visualEnergy;
        drawCameraRefractionLayer();
        drawGridFaceLayer();
        drawGhostEyeLayer();
        drawNoiseBodyLayer();
        drawingContext.globalAlpha = 1;
        pop();

        drawVignette();
        drawScanLines();
      } else {
        drawOldTVFrame();
      }
    }

    function drawOldTVSnow(amount) {
      if (amount <= 0.01) return;

      // Optimised: create low-res snow and scale it up instead of drawing thousands of rectangles on the full canvas.
      snowG.loadPixels();
      const pixels = snowG.pixels;

      for (let i = 0; i < pixels.length; i += 4) {
        const r = random(1);
        let v;

        if (r < 0.18) v = 0;
        else if (r < 0.42) v = random(35, 95);
        else if (r < 0.78) v = random(120, 210);
        else v = 255;

        const flicker = random(0.45, 1.0) * amount;
        pixels[i] = v;
        pixels[i + 1] = v;
        pixels[i + 2] = v;
        pixels[i + 3] = 255 * flicker;
      }

      snowG.updatePixels();

      push();
      drawingContext.imageSmoothingEnabled = false;
      tint(255, 255 * amount);
      image(snowG, 0, 0, width, height);
      noTint();

      // Fewer glitch bands than before, still keeps old TV feeling.
      noStroke();
      const bandCount = floor(8 + amount * 18);
      for (let i = 0; i < bandCount; i++) {
        const y = random(height);
        const h = random(1, 6);
        const alpha = random(25, 130) * amount;
        const shift = sin(frameCount * 0.08 + y * 0.03) * random(10, 70);

        fill(255, alpha);
        rect(shift, y, width, h);

        if (random(1) < 0.3) {
          fill(0, alpha * 0.75);
          rect(-shift, y + h + random(1, 5), width, random(1, 3));
        }
      }

      stroke(0, 95 * amount);
      strokeWeight(1);
      for (let y = 0; y < height; y += 6) {
        line(0, y, width, y);
      }

      pop();
    }

    function drawOldTVFrame() {
      push();
      noFill();

      stroke(255, 25);
      strokeWeight(1);
      rect(30, 30, width - 60, height - 60);

      stroke(255, random(50, 120));
      strokeWeight(2);
      const y = random(height);
      line(0, y, width, y + random(-10, 10));

      fill(255, 45);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      text("NO SIGNAL / WAITING FOR EYE", width / 2, height - 52);

      pop();
    }

    function drawCameraRefractionLayer() {
      if (!video || video.readyState < 2) return;

      const baseW = min(width * 0.62, 760);
      const baseH = baseW * 0.62;
      const strips = 24; // lighter than 36
      const stripH = baseH / strips;

      push();
      tint(255, 60 + visualEnergy * 155);

      for (let i = 0; i < strips; i++) {
        const y = -baseH / 2 + i * stripH;
        const wave = sin(frameCount * 0.035 + i * 0.52) * (8 + visualEnergy * 55);
        const stretch = 1 + visualEnergy * sin(i * 0.7 + frameCount * 0.04) * 0.28;

        const sx = 0;
        const sy = map(i, 0, strips, 0, video.videoHeight || 480);
        const sw = video.videoWidth || 640;
        const sh = (video.videoHeight || 480) / strips;

        drawingContext.save();
        drawingContext.filter = `contrast(${1.55 + visualEnergy * 1.5}) grayscale(1) brightness(${1.15 + visualEnergy * 0.4})`;
        drawingContext.drawImage(
          video,
          sx, sy, sw, sh,
          -baseW / 2 + wave,
          y,
          baseW * stretch,
          stripH + 1
        );
        drawingContext.restore();
      }

      pop();
    }

    function drawGridFaceLayer() {
      const cols = 18;
      const rows = 13;
      const cell = min(width / cols, height / rows) * 1.15;
      const gridW = cols * cell;
      const gridH = rows * cell;

      push();
      translate(-gridW / 2, -gridH / 2);
      noFill();

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const cx = x * cell;
          const cy = y * cell;
          const d = dist(cx, cy, gridW / 2, gridH / 2);
          const pulse = sin(frameCount * 0.03 + x * 0.45 + y * 0.25);
          const alpha = map(d, 0, gridW * 0.55, 85, 10, true) + visualEnergy * 70 * max(0, pulse);

          stroke(255, alpha * 0.38);
          strokeWeight(0.7);
          rect(cx, cy, cell, cell);

          if (visualEnergy > 0.03 && random(1) < 0.012 + visualEnergy * 0.022) {
            noStroke();
            fill(255, 40 + visualEnergy * 110);
            rect(cx, cy, cell, cell);
          }
        }
      }

      pop();
    }

    function drawGhostEyeLayer() {
      const copies = eyeDetected ? 5 : 2;
      const spread = 34 + visualEnergy * 140;

      push();
      blendMode(ADD);

      for (let i = -copies; i <= copies; i++) {
        const offsetX = i * spread * 0.24 + sin(frameCount * 0.04 + i) * 30 * visualEnergy;
        const offsetY = sin(i * 0.8 + frameCount * 0.025) * 28 * visualEnergy;
        const scaleX = 1.0 + i * 0.018;
        const alpha = map(abs(i), 0, copies, 180, 16) * (0.28 + visualEnergy * 0.72);

        push();
        translate(offsetX, offsetY - height * 0.03);
        scale(scaleX, 1);
        drawAbstractEye(0, 0, 260 + visualEnergy * 120, 82 + visualEnergy * 42, alpha, i);
        pop();
      }

      pop();
    }

    function drawAbstractEye(x, y, w, h, alpha, index) {
      noFill();
      strokeWeight(3.2);
      stroke(255, alpha);

      beginShape();
      for (let a = 0; a <= TWO_PI; a += 0.07) { // lighter than 0.04
        const nx = cos(a) * w * 0.5;
        const pinch = pow(abs(sin(a)), 0.45);
        const ny = sin(a) * h * 0.5 * pinch;
        const warp = noise(index * 3, a * 1.5, frameCount * 0.01) * 24 * visualEnergy;
        vertex(x + nx, y + ny + warp - 12 * visualEnergy);
      }
      endShape(CLOSE);

      noStroke();
      fill(255, alpha * 0.9);
      ellipse(x, y, w * 0.18, h * 0.42);

      fill(0, alpha * 0.92);
      ellipse(x, y, w * 0.1, h * 0.28);

      stroke(255, alpha * 0.55);
      strokeWeight(1.2);
      for (let i = 0; i < 5; i++) {
        const yy = y + map(i, 0, 4, -h * 0.45, h * 0.45);
        line(x - w * 0.42, yy, x + w * 0.42, yy + sin(frameCount * 0.04 + i) * 10 * visualEnergy);
      }
    }

    function drawNoiseBodyLayer() {
      const bodyAlpha = 28 + visualEnergy * 115;

      push();
      blendMode(SCREEN);
      noStroke();

      for (let i = 0; i < 85; i++) { // lighter than 140
        const n = noise(i * 0.08, frameCount * 0.012);
        const angle = map(i, 0, 85, -PI * 0.85, PI * 0.85);
        const r = map(n, 0, 1, height * 0.08, height * 0.42);
        const x = cos(angle) * r * 0.48;
        const y = sin(angle) * r + height * 0.1;
        const size = map(noise(i, frameCount * 0.02), 0, 1, 1, 5 + visualEnergy * 12);

        fill(255, bodyAlpha * noise(i * 0.3, frameCount * 0.03));
        ellipse(x, y, size, size * 1.8);
      }

      if (visualEnergy > 0.2) {
        fill(255, 18 + visualEnergy * 40);
        beginShape();
        vertex(-80, -40);
        bezierVertex(-150, 150, -120, 310, -40, 360);
        bezierVertex(20, 395, 130, 260, 95, 90);
        bezierVertex(80, 20, 30, -45, -80, -40);
        endShape(CLOSE);
      }

      pop();
    }

    function drawVignette() {
      push();
      noFill();
      for (let i = 0; i < 42; i++) { // lighter than 80
        stroke(0, map(i, 0, 41, 0, 210));
        strokeWeight(10);
        rect(i * 5, i * 5, width - i * 10, height - i * 10);
      }
      pop();
    }

    function drawScanLines() {
      push();
      stroke(255, 9 + visualEnergy * 18);
      strokeWeight(1);
      for (let y = 0; y < height; y += 9) {
        line(0, y + sin(frameCount * 0.04 + y * 0.01) * visualEnergy * 3, width, y);
      }

      if (eyeDetected && random(1) < 0.55) {
        const glitchY = random(height);
        stroke(255, random(80, 180));
        strokeWeight(random(1, 4));
        line(0, glitchY, width, glitchY + random(-12, 12));
      }
      pop();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
